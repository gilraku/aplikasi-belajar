veal, tabs).\n2. \"simulator\" (Simulator & Studi Kasus): minimal 2 blok praktik sesuai topik, misalnya detective (cari kesalahan), terminal (simulasi perintah/kode/rumus beserta hasilnya), atau exercise (latihan merancang/menghitung dengan cek jawaban otomatis).\n3. \"flashcards\": 12 kartu istilah kunci / pertanyaan jebakan.\n4. \"quiz\": 10 soal pilihan ganda bertingkat (mudah → sulit, termasuk soal jebakan dan studi kasus), masing-masing 4 opsi, dengan \"exp\" (pembahasan) dan \"optExp\" (alasan singkat untuk SETIAP opsi kenapa benar/salah).\n5. \"ringkasan\": teks rangkuman kilat untuk dikirim ke WhatsApp (pakai *tebal*, emoji nomor 1️⃣ 2️⃣, dan poin •).\n\nATURAN FORMAT:\n- Jawab HANYA dengan satu blok kode JSON yang valid (tanpa komentar, tanpa teks lain).\n- Semua isi dalam Bahasa Indonesia yang mudah dipahami mahasiswa, akurat sesuai materi yang dilampirkan.\n- Teks boleh memakai HTML sederhana: \u003cstrong>, \u003cem>, \u003ccode>, \u003cbr>, \u003cul>\u003cli>. Tidak boleh \u003cscript>, gambar, atau link.\n- \"ans\" pada quiz adalah indeks opsi benar mulai dari 0 (0 = A, 1 = B, 2 = C, 3 = D). Sebarkan jawaban benar, jangan selalu B.\n- Pada blok table/detective, \"row\" dan \"col\" juga mulai dari 0 dan dihitung dari baris data (baris judul tidak dihitung).\n\nSTRUKTUR JSON:\n{\n  \"id\": \"slug-mata-kuliah\",            // contoh \"sif002-basis-data\" (huruf kecil, tanpa spasi)\n  \"kode\": \"SIF002\",\n  \"nama\": \"Basis Data\",\n  \"kampus\": \"…\", \"prodi\": \"…\", \"dosen\": \"…\",\n  \"meetings\": [{\n    \"id\": \"p3\",                         // \"p\" + nomor pertemuan\n    \"nomor\": 3,\n    \"judul\": \"Judul Materi Pertemuan\",\n    \"ujian\": \"UTS\",\n    \"hero\": { \"badge\": \"…\", \"title\": \"Kalimat penyemangat singkat\", \"text\": \"Apa yang akan dipelajari\" },\n    \"cheatsheet\": [ BLOK, BLOK, … ],\n    \"simulator\": [ BLOK, BLOK, … ],\n    \"flashcards\": [ { \"tag\": \"Jebakan UTS\", \"q\": \"Pertanyaan\", \"a\": \"Jawaban\" } ],\n    \"quiz\": [ { \"q\": \"Soal\", \"opts\": [\"A\", \"B\", \"C\", \"D\"], \"ans\": 2, \"exp\": \"Pembahasan\", \"optExp\": [\"kenapa A salah\", \"kenapa B salah\", \"kenapa C benar\", \"kenapa D salah\"] } ],\n    \"ringkasan\": \"*RANGKUMAN KILAT …*\\n1️⃣ …\"\n  }]\n}\n\nSetiap BLOK boleh punya \"label\" (teks kecil di atas, misal \"Interaktif 1 • Topik\"), \"title\", dan \"desc\". Jenis BLOK yang tersedia:\n\n{ \"type\": \"text\", \"html\": \"Paragraf penjelasan.\" }\n{ \"type\": \"callout\", \"tone\": \"info|tip|warn|danger|success\", \"title\": \"Judul\", \"html\": \"Isi kotak sorotan\" }\n{ \"type\": \"cards\", \"cols\": 3, \"items\": [ { \"badge\": \"1. Istilah\", \"title\": \"Arti singkat\", \"text\": \"Penjelasan\", \"tone\": \"indigo\" } ] }\n{ \"type\": \"list\", \"groups\": [ { \"title\": \"Kelompok A\", \"items\": [\"poin 1\", \"poin 2\"], \"tone\": \"emerald\" } ] }\n{ \"type\": \"flow\", \"items\": [\"Input\", \"Proses\", \"Output\"], \"arrow\": \"→\", \"highlight\": 1 }   // alur/diagram sederhana\n{ \"type\": \"tabs\", \"tabs\": [ { \"label\": \"1. Sub-topik\", \"blocks\": [ BLOK, … ] } ] }        // sub-tab, cocok untuk ringkasan slide\n{ \"type\": \"row\", \"cols\": [5, 7], \"blocks\": [ BLOK, BLOK ] }                                 // dua blok berdampingan\n{ \"type\": \"choices\", \"style\": \"toggle|pills\", \"options\": [ { \"label\": \"Tombol\", \"tone\": \"rose\", \"badge\": \"Label kecil\", \"title\": \"Judul penjelasan\", \"code\": \"contoh kode/rumus (opsional)\", \"text\": \"Penjelasan\", \"note\": \"Catatan (opsional)\" } ], \"footer\": \"Catatan di bawah (opsional)\" }\n   // saklar perbandingan (toggle, 2-3 pilihan) atau tombol pilihan konsep (pills)\n{ \"type\": \"table\", \"headers\": [\"kolom1\", { \"label\": \"kolom2\", \"note\": \"penjelasan bila header diklik\" }], \"rows\": [[\"a\", \"b\"]], \"keyCol\": 0,\n  \"modes\": [ { \"label\": \"Sorot judul\", \"target\": \"header|col|row|cell|none\", \"row\": 0, \"col\": 0, \"title\": \"…\", \"text\": \"…\" } ],\n  \"notes\": [ { \"title\": \"…\", \"text\": \"…\" } ], \"defaultNote\": \"…\" }\n   // tabel X-ray: tombol \"modes\" menyorot bagian tabel sambil menampilkan penjelasan\n{ \"type\": \"reveal\", \"items\": [ { \"prompt\": \"Pertanyaan/istilah\", \"answer\": \"Jawaban\", \"reason\": \"Alasan\" } ] }   // klik untuk membuka jawaban\n{ \"type\": \"detective\", \"rules\": [\"Aturan 1\", \"Aturan 2\"], \"headers\": [\"…\"], \"rows\": [[\"…\"]],\n  \"bugs\": [ { \"row\": 1, \"col\": 2, \"fixed\": \"nilai yang benar\", \"explain\": \"Kesalahan apa & aturan mana yang dilanggar\" } ] }\n   // game detektif: sel berisi kesalahan diklik untuk diperbaiki\n{ \"type\": \"terminal\", \"shell\": \"mysql>|$|>>>|=\", \"header\": \"Judul terminal\", \"scenarios\": [ { \"label\": \"Nama skenario\", \"code\": \"label kecil\", \"ok\": false, \"pill\": \"ERROR 1062\", \"cmd\": \"perintah/kode/rumus\", \"res\": \"hasil/output\", \"exp\": \"Penyebab & perbaikan\" } ] }\n   // simulasi perintah/kode/perhitungan: pilih skenario, lihat output dan penjelasannya\n{ \"type\": \"exercise\", \"preview\": \"teks soal/kasus (boleh multi-baris)\", \"headers\": [\"Soal\", \"Jawaban 1\", \"Jawaban 2\"],\n  \"rows\": [ { \"cells\": [\"teks soal baris ini\"], \"fields\": [ { \"options\": [\"pilihan1\", \"pilihan2\"], \"answer\": \"pilihan1\" }, { \"answer\": 42, \"tolerance\": 0.01, \"placeholder\": \"isi angka\" } ],\n              \"ok\": \"✓ Pesan bila benar\", \"hints\": [ { \"field\": 0, \"value\": \"pilihan2\", \"msg\": \"✗ Petunjuk khusus jika memilih ini\" } ] } ] }\n   // latihan merancang/menghitung dengan cek otomatis. field dengan \"options\" = dropdown; tanpa \"options\" = isian bebas (angka dicek dengan tolerance, teks tidak peka huruf besar/kecil; \"answer\" boleh berupa array beberapa jawaban yang diterima)\n\nPilih jenis blok yang paling cocok dengan topik (misal: rumus/hitungan → exercise & terminal dengan shell \"=\"; pemrograman → terminal dengan shell \"$\" atau \">>>\"; teori → choices, cards, tabs, reveal). Buat semuanya selengkap dan seakurat mungkin dari materi yang aku lampirkan.\n"</script><script id="app-config" type="application/json">{"semester":"Semester 1","base":"/aplikasi-belajar/beta/","v":"c6389e061e"}</script><script src="/aplikasi-belajar/beta/app-e8eacfd22e.js"></script></body></html>
