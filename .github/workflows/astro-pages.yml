# Deploy versi Astro sebagai situs UTAMA (gilraku.github.io/aplikasi-belajar/).
# Hanya jalan kalau dipicu manual (tab Actions → Run workflow), jadi tidak mengubah situs live.
# Sebelum dipakai: Settings → Pages → Source = "GitHub Actions".
name: Deploy Astro ke GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          ASTRO_BASE: /aplikasi-belajar/
          ASTRO_OUT: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
