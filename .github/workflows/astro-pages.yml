# Bangun versi Astro (web/) dari materi di sumber/, cek dulu, lalu terbitkan sebagai situs utama
# https://gilraku.github.io/aplikasi-belajar/ setiap ada push ke main.
# Di pull request hanya build + cek (tidak terbit). Syarat: Settings → Pages → Source = "GitHub Actions".
name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cek kerentanan paket (gagal kalau ada yang tingkat tinggi)
        run: npm audit --audit-level=high
      - name: Build (sekaligus validasi data materi)
        run: npm run build
      - name: Siapkan browser untuk tes
        run: npx playwright install --with-deps chromium
      - name: Tes semua halaman
        run: npm test
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
