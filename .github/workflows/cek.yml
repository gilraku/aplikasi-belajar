# Bangun versi Astro (web/) dari materi di sumber/ lalu tes semua halaman, di setiap PR dan push ke main.
# Situs diterbitkan oleh Vercel (vercel.json); GitHub Pages tidak dipakai lagi.
name: Cek build dan tes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cek-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cek kerentanan paket (gagal kalau ada yang tingkat tinggi)
        run: npm audit --audit-level=high
      - name: Build (sekaligus validasi data materi)
        run: npm run build
      - name: Siapkan browser untuk tes
        run: npx playwright install --with-deps chromium
      - name: Tes semua halaman
        run: npm test
      - name: Build + tes versi Vercel (base /)
        env:
          ASTRO_BASE: /
          ASTRO_SITE: https://sinau.vercel.app
          ASTRO_OUT: dist-root
        run: npm run build && npm test
